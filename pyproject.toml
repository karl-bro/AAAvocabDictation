[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-dictation"
version = "1.0.0"
description = "考研生词本听写闭环工具箱：识别清单入库、抽样出卷、批改评分、错题摘帽、报告输出，一次封装多协议复用"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AAAvocabDictation Contributors"}]
keywords = ["vocabulary", "dictation", "spaced-repetition", "llm", "agent", "skill", "education"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Topic :: Education",
]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
pdf = ["reportlab>=4.0", "pymupdf>=1.23"]
image = ["pillow>=10.0", "numpy>=1.24"]
dev = ["pytest>=7.4", "reportlab>=4.0", "pymupdf>=1.23", "pillow>=10.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/karl-bro/AAAvocabDictation"
Repository = "https://github.com/karl-bro/AAAvocabDictation"
Issues = "https://github.com/karl-bro/AAAvocabDictation/issues"

[project.scripts]
vocabdict = "vocab_dictation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vocab_dictation = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
