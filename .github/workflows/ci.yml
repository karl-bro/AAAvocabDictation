name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CJK font (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate tool schemas and verify they are committed
        run: |
          python scripts/export_tool_schemas.py
          git diff --exit-code schemas/

      - name: Run tests
        run: pytest -q

      # 显式指定编码读回：Windows runner 的默认 locale 不能解码中文，
      # 用 utf-8-sig 同时兼容 pwsh 重定向与 BOM。
      - name: Smoke test CLI
        run: |
          vocabdict version
          vocabdict capabilities --pretty > capabilities.out.json
          python -c "import json, io; d = json.load(io.open('capabilities.out.json', encoding='utf-8-sig')); assert len(d['actions']) >= 14; print('capabilities OK:', len(d['actions']))"

      - name: End-to-end example
        run: python examples/01_quickstart.py
